<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW #3: Dog Breed Finder</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <header>
        <h1>Dog Breed Image Finder</h1>
        <p>Select a dog breed to show an image!</p>
    </header>

    <main>
        <form id="breedForm">

            <label for="breedSelect">Choose a Dog Breed:</label>
            <select id="breedSelect" required>
                <option value="">Loading breeds...</option>
            </select>
            <button type="submit">Find Dog</button>

        </form>
        <section id="result">
            <p>Select a breed to display a photo.</p>
        </section>
    </main>

    <footer>
        <p>Images provided by Dog CEO API</p>
